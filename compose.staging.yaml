name: latent-staging

services:
  api:
    image: latent-api:staging
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    environment:
      ENVIRONMENT: staging
      RUN_MIGRATIONS_ON_STARTUP: "false"
      CREATE_DB_ON_STARTUP: "false"
    ports:
      - "127.0.0.1:${STAGING_API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    image: latent-web:staging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env.staging}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env.staging}
        NEXT_PUBLIC_API_TIMEOUT_MS: ${NEXT_PUBLIC_API_TIMEOUT_MS:-60000}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${STAGING_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
