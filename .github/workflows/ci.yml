name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: latent_test
          POSTGRES_USER: latent
          POSTGRES_PASSWORD: latent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U latent -d latent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://latent:latent@localhost:5432/latent_test
      DATABASE_SSL_MODE: disable
      ENVIRONMENT: test
      AUTH_SECRET_KEY: ci-only-secret-key-not-for-production
      CORS_ORIGINS: http://127.0.0.1:3010
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements-dev.txt

      - name: Verify PostgreSQL migrations
        run: |
          venv/bin/alembic upgrade head
          venv/bin/alembic current
          venv/bin/alembic downgrade base
          venv/bin/alembic upgrade head

      - name: Verify PostgreSQL readiness
        run: |
          venv/bin/python - <<'PY'
          from fastapi.testclient import TestClient
          from src.api.main import create_app

          with TestClient(create_app()) as client:
              response = client.get('/api/v1/ready')
              response.raise_for_status()
              assert response.json()['database'] == 'postgresql'
          PY

      - name: Backend tests
        run: venv/bin/pytest -q

      - name: Python dependency integrity
        run: venv/bin/pip check

      - name: Python vulnerability audit
        run: venv/bin/pip-audit --strict --requirement requirements.txt

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Frontend checks
        working-directory: frontend
        run: npm run check

      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end journey
        working-directory: frontend
        run: npm run test:e2e

      - name: Check for committed provider secrets
        run: |
          if git grep -nE 'nvapi-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|postgres(ql)?(\+psycopg)?://[^[:space:]]+:[^[:space:]@]+@[^[:space:]]+\.(neon\.tech|supabase\.co|amazonaws\.com)|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'; then
            echo "Potential credential or private key found in tracked files."
            exit 1
          fi

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
