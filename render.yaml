services:
  - type: web
    name: latent-regime-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/ready
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DATABASE_SSL_MODE
        value: require
      - key: DATABASE_POOL_SIZE
        value: "2"
      - key: DATABASE_MAX_OVERFLOW
        value: "3"
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: "8"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "10"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "false"
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: CORS_ORIGINS
        value: https://latent-regime.onrender.com
      - key: TRUSTED_HOSTS
        value: latent-regime-api.onrender.com,latent-regime.onrender.com,127.0.0.1,localhost
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: REGIME_RUNTIME_FIT_ENABLED
        value: "false"
      - key: REQUIRE_VALIDATED_REGIME_MODEL
        value: "false"
      - key: NVIDIA_API_KEY
        sync: false

  - type: web
    name: latent-regime
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/v1
      - key: LATENT_API_ORIGIN
        value: https://latent-regime-api.onrender.com
      - key: NEXT_PUBLIC_API_TIMEOUT_MS
        value: "90000"
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://latent-regime.onrender.com
